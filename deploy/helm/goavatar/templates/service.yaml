apiVersion: v1
kind: Service
metadata:
  name: goavatar-server
  namespace: {{ include "goavatar.namespace" . }}
  labels:
    app: goavatar-server
spec:
  type: {{ .Values.service.type }}
  selector:
    app: goavatar-server
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
