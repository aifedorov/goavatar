apiVersion: v1
kind: Secret
metadata:
  name: goavatar-secrets
  namespace: {{ include "goavatar.namespace" . }}
type: Opaque
stringData:
  DATABASE_URI: {{ required "secrets.databaseUri is required" .Values.secrets.databaseUri | quote }}
  S3_ACCESS_KEY: {{ required "secrets.s3AccessKey is required" .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ required "secrets.s3SecretKey is required" .Values.secrets.s3SecretKey | quote }}
  RABBITMQ_URL: {{ required "secrets.rabbitmqUrl is required" .Values.secrets.rabbitmqUrl | quote }}
