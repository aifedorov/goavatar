apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: {{ include "goavatar.namespace" . }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ required "minio.rootUser is required" .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ required "minio.rootPassword is required" .Values.minio.rootPassword | quote }}
