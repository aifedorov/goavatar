apiVersion: v1
kind: ConfigMap
metadata:
  name: goavatar-config
  namespace: {{ include "goavatar.namespace" . }}
data:
  HTTP_ADDRESS: {{ .Values.config.httpAddress | quote }}
  METRICS_ADDRESS: {{ .Values.config.metricsAddress | quote }}
  WORKER_HEALTH_ADDRESS: {{ .Values.worker.healthAddress | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_USE_SSL: {{ .Values.config.s3UseSSL | quote }}
  MAX_UPLOAD_BYTES: {{ .Values.config.maxUploadBytes | quote }}
  STATIC_DIR: {{ .Values.config.staticDir | quote }}
