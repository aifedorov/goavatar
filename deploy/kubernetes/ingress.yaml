apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goavatar-server
  namespace: goavatar
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: avatars.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goavatar-server
                port:
                  number: 80
