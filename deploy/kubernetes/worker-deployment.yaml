apiVersion: apps/v1
kind: Deployment
metadata:
  name: goavatar-worker
  namespace: goavatar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goavatar-worker
  template:
    metadata:
      labels:
        app: goavatar-worker
    spec:
      serviceAccountName: goavatar-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: goavatar:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/app/worker"]
          envFrom:
            - configMapRef:
                name: goavatar-config
            - secretRef:
                name: goavatar-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
